#
# Builds and tests the ashgrove.lv2 bundle on Windows, Linux and macOS.
# Every push uploads the three bundles as workflow artifacts. Pushing a tag such as
# v1.1.0 also publishes them as a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
            lib: ashgrove.dll
            configure: -A x64
          - os: ubuntu-22.04
            name: linux-x64
            lib: ashgrove.so
            configure: -DCMAKE_BUILD_TYPE=Release
          - os: macos-14
            name: macos-universal
            lib: ashgrove.dylib
            configure: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev lilv-utils

      - name: Configure
        run: cmake -S . -B out ${{ matrix.configure }}

      - name: Build
        run: cmake --build out --config Release --parallel

      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bin=out/Release; else bin=out; fi
          bundle=out/lv2/ashgrove.lv2
          "$bin/cab_check"
          "$bin/ui_ports_check"
          "$bin/plugin_check" "$bundle/${{ matrix.lib }}"
          "$bin/idle_check"
          "$bin/spec_test" > spec_results.txt
          tail -n 5 spec_results.txt

      - name: Check the bundle with lilv (Linux)
        if: runner.os == 'Linux'
        run: |
          export LV2_PATH="$PWD/out/lv2"
          for uri in classic-lead cascade-lead low-end spring-combo dual-rail; do
            lv2info "urn:davidian:ashgrove-$uri" > info.txt
            grep -E "Name:|Binary:|UI:" info.txt
            grep -q "Binary:" info.txt || exit 1
          done
          # The libraries must not depend on a newer C++ runtime than the host has.
          ! ldd out/lv2/ashgrove.lv2/ashgrove.so | grep -q libstdc++
          ldd out/lv2/ashgrove.lv2/ashgrove_ui.so

      - name: Check the universal binary (macOS)
        if: runner.os == 'macOS'
        run: lipo -info out/lv2/ashgrove.lv2/ashgrove.dylib | grep -q "x86_64 arm64\|arm64 x86_64"

      - name: Package
        run: |
          mkdir -p dist/ashgrove.lv2
          cp out/lv2/ashgrove.lv2/*.ttl dist/ashgrove.lv2/
          cp out/lv2/ashgrove.lv2/ashgrove*.* dist/ashgrove.lv2/ 2>/dev/null || true
          rm -f dist/ashgrove.lv2/*.lib dist/ashgrove.lv2/*.exp dist/ashgrove.lv2/*.pdb
          cp LICENSE LICENSE-LV2 dist/ashgrove.lv2/
          ls -l dist/ashgrove.lv2
          cd dist && cmake -E tar cf "ashgrove-${{ matrix.name }}.zip" --format=zip ashgrove.lv2

      - uses: actions/upload-artifact@v4
        with:
          name: ashgrove-${{ matrix.name }}
          path: dist/ashgrove-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "Davidian Ashgrove ${GITHUB_REF_NAME#v}" \
            --notes "Ready-built ashgrove.lv2 bundles for Windows (x64), Linux (x64) and macOS (Apple silicon and Intel). Unzip and copy the ashgrove.lv2 folder into your LV2 folder; see the README for paths."
