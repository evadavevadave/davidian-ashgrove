# Copyright (C) 2026 Davidian
#
# Builds and tests the plugins on Windows, Linux and macOS, in every format:
# LV2, CLAP, VST3, and AU on macOS. Every branch push uploads one zip per system as a
# workflow artifact. Pushing a tag such as v1.2.0 also publishes them as a release.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
            lib: ashgrove.dll
            configure: -A x64
            plugins: out/plugins
          - os: ubuntu-22.04
            name: linux-x64
            lib: ashgrove.so
            configure: -DCMAKE_BUILD_TYPE=Release
            plugins: out/plugins
          - os: macos-latest
            name: macos-universal
            lib: ashgrove.dylib
            configure: '-DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'
            plugins: out/plugins
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev lilv-utils ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja

      - name: Configure
        run: mkdir -p logs && cmake -S . -B out ${{ matrix.configure }} 2>&1 | tee logs/configure.txt

      - name: Build
        run: cmake --build out --config Release --parallel 2>&1 | tee logs/build.txt

      - name: Find the built plugins
        run: |
          p=${{ matrix.plugins }}
          find "$p" -maxdepth 3 | sort
          # Multi-config generators (Visual Studio) add a Release folder, so search.
          clap=$(find "$p" -maxdepth 3 -name "*.clap" | head -n 1)
          vst3=$(find "$p" -maxdepth 3 -name "*.vst3" -type d | head -n 1)
          au=$(find "$p" -maxdepth 3 -name "*.component" | head -n 1)
          echo "CLAP_DIR=$clap" >> "$GITHUB_ENV"
          echo "VST3_DIR=$vst3" >> "$GITHUB_ENV"
          echo "AU_DIR=$au" >> "$GITHUB_ENV"
          case "$RUNNER_OS" in
            Windows) echo "BIN=out/Release" >> "$GITHUB_ENV"; echo "CLAP_BIN=$clap" >> "$GITHUB_ENV" ;;
            Linux) echo "BIN=out" >> "$GITHUB_ENV"; echo "CLAP_BIN=$clap" >> "$GITHUB_ENV" ;;
            macOS) echo "BIN=out" >> "$GITHUB_ENV"; echo "CLAP_BIN=$clap/Contents/MacOS/Davidian Ashgrove" >> "$GITHUB_ENV" ;;
          esac
          test -n "$clap" && test -n "$vst3"

      - name: Test
        run: |
          exec > >(tee logs/test.txt) 2>&1
          "$BIN/cab_check"
          "$BIN/ui_ports_check"
          "$BIN/plugin_check" "out/lv2/ashgrove.lv2/${{ matrix.lib }}"
          "$BIN/clap_check" "$CLAP_BIN"
          "$BIN/idle_check"
          "$BIN/spec_test" > spec_results.txt
          tail -n 5 spec_results.txt

      - name: Validate the VST3 with Steinberg's validator
        run: |
          exec > >(tee logs/validator.txt) 2>&1
          cmake --build out --config Release --target vst3_validator
          v=$(find out/validator-build -type f \( -name validator -o -name validator.exe \) | head -n 1)
          echo "validator: $v"
          "$v" "$VST3_DIR"

      - name: Validate the Audio Units with auval (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$AU_DIR" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i Dvdn
          for sub in AgCL AgCC AgLE AgSC AgDR; do
            auval -v aufx "$sub" Dvdn > "auval-$sub.txt" 2>&1 || { tail -n 40 "auval-$sub.txt"; exit 1; }
            tail -n 3 "auval-$sub.txt"
          done

      - name: Check the Cocoa GUI (macOS)
        if: runner.os == 'macOS'
        run: |
          exec > >(tee logs/ui.txt) 2>&1
          mkdir -p shots
          "$BIN/ui_mac_check" out/lv2/ashgrove.lv2 shots
          grep -q CocoaUI out/lv2/ashgrove.lv2/manifest.ttl

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && always()
        with:
          name: ui-screenshots-macos
          path: shots/*.png
          if-no-files-found: ignore

      - name: Check the bundle with lilv (Linux)
        if: runner.os == 'Linux'
        run: |
          export LV2_PATH="$PWD/out/lv2"
          for uri in classic-lead cascade-lead low-end spring-combo dual-rail; do
            lv2info "urn:davidian:ashgrove-$uri" > info.txt
            grep -E "Name:|Binary:|UI:" info.txt
            grep -q "Binary:" info.txt || exit 1
          done
          # The libraries must not depend on a newer C++ runtime than the host has.
          ! ldd out/lv2/ashgrove.lv2/ashgrove.so | grep -q libstdc++
          ldd out/lv2/ashgrove.lv2/ashgrove_ui.so

      - name: Check the universal binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in out/lv2/ashgrove.lv2/ashgrove.dylib "$CLAP_BIN" \
                   "$VST3_DIR/Contents/MacOS/Davidian Ashgrove" "$AU_DIR/Contents/MacOS/Davidian Ashgrove"; do
            lipo -info "$f" | grep -q "x86_64 arm64\|arm64 x86_64" || { lipo -info "$f"; exit 1; }
          done

      - name: Package
        run: |
          d=dist/Ashgrove
          mkdir -p "$d/LV2/ashgrove.lv2" "$d/CLAP" "$d/VST3"
          cp out/lv2/ashgrove.lv2/*.ttl "$d/LV2/ashgrove.lv2/"
          cp out/lv2/ashgrove.lv2/ashgrove*.* "$d/LV2/ashgrove.lv2/" 2>/dev/null || true
          rm -f "$d"/LV2/ashgrove.lv2/*.lib "$d"/LV2/ashgrove.lv2/*.exp "$d"/LV2/ashgrove.lv2/*.pdb
          cp -R "$CLAP_DIR" "$d/CLAP/"
          cp -R "$VST3_DIR" "$d/VST3/"
          if [ -n "$AU_DIR" ]; then mkdir -p "$d/AU" && cp -R "$AU_DIR" "$d/AU/"; fi
          find "$d" \( -name "*.pdb" -o -name "*.lib" -o -name "*.exp" -o -name "*.ilk" \) -delete
          cp LICENSE LICENSE-LV2 "$d/"
          # Licence texts of the SDKs built into the VST3, AU and CLAP versions.
          mkdir -p "$d/licenses"
          cp out/_deps/clap-wrapper-src/LICENSE* "$d/licenses/clap-wrapper-LICENSE.txt"
          for n in clap vst3sdk AudioUnitSDK; do
            f=$(find out -maxdepth 6 -path "*cpm/$n/LICENSE*" -type f | head -n 1)
            if [ -n "$f" ]; then cp "$f" "$d/licenses/$n-LICENSE.txt"; fi
          done
          ls "$d/licenses"
          find "$d" | sort
          cd dist && cmake -E tar cf "ashgrove-${{ matrix.name }}.zip" --format=zip Ashgrove

      # Step logs need a GitHub sign-in to read; annotations do not, so the first
      # error lines of each log are repeated as annotations.
      - name: Report errors
        if: failure()
        run: |
          for f in logs/*.txt; do
            grep -E -i "error|FAIL|fatal|undefined reference|cannot|not found|relocation|recompile|hidden symbol|DSO|multiple definition|/ld:" "$f" \
              | grep -E -v -i "warning|[^0-9]0 error|-Werror|Error [12]$" \
              | head -n 10 | sed "s|^|::error title=$(basename "$f")::|" || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ashgrove-${{ matrix.name }}
          path: dist/ashgrove-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "Davidian Ashgrove ${GITHUB_REF_NAME#v}" \
            --notes "Ready-built plugins for Windows (x64), Linux (x64) and macOS (Apple silicon and Intel): LV2, CLAP and VST3 on all three, plus Audio Units on macOS. Unzip and copy each format's folder into your plugin folders; see the README for paths."
